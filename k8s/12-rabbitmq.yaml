# Fila (RabbitMQ): serviço COM estado -> StatefulSet + volume, como o banco.
# O nome fixo do pod (rabbitmq-0) importa: o RabbitMQ guarda os dados numa pasta com o nome do host.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: aps
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
    - name: painel            # kubectl port-forward -n aps svc/rabbitmq 15672
      port: 15672
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: aps
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom:
                secretKeyRef: { name: banco-credenciais, key: RABBITMQ_USER }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef: { name: banco-credenciais, key: RABBITMQ_PASSWORD }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1", memory: 512Mi }
          volumeMounts:
            - name: dados
              mountPath: /var/lib/rabbitmq
          # O RabbitMQ demora a subir: a startup dá até 2 min antes de as outras probes valerem.
          # Aqui é só a porta, de propósito: rodar o rabbitmq-diagnostics antes de o servidor
          # criar o cookie do Erlang faz a primeira partida falhar.
          startupProbe:
            tcpSocket: { port: 5672 }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            periodSeconds: 30
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            periodSeconds: 10
            timeoutSeconds: 10
  volumeClaimTemplates:          # PVC dados-rabbitmq-0: as mensagens persistentes sobrevivem ao pod
    - metadata:
        name: dados
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
