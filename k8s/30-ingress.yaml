# Gateway único: roteia POR CAMINHO para os três serviços; o resto (/) vai para o cliente web.
# O prefixo chega inteiro à API; o UsePathBase (PATH_BASE) o remove antes do roteamento.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway
  namespace: aps
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /air-quality
            pathType: Prefix
            backend:
              service:
                name: air-quality-api
                port:
                  number: 80
          - path: /flooding
            pathType: Prefix
            backend:
              service:
                name: flooding-api
                port:
                  number: 80
          - path: /thermal-inversion
            pathType: Prefix
            backend:
              service:
                name: thermal-inversion-api
                port:
                  number: 80
          - path: /                    # o prefixo mais específico ganha; "/" pega o que sobrar
            pathType: Prefix
            backend:
              service:
                name: web-client
                port:
                  number: 80
