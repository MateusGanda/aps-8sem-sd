# Cliente leve: página estática em nginx. Sem estado -> Deployment (2 réplicas) + Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-client
  namespace: aps
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-client
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: web-client
    spec:
      containers:
        - name: nginx
          image: aps-sd/web-client:1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 20m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 64Mi }
          # Liveness: só "o nginx está de pé?" (porta aberta). Readiness: "a página é entregue?"
          livenessProbe:
            tcpSocket: { port: 80 }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: web-client
  namespace: aps
spec:
  selector:
    app: web-client
  ports:
    - port: 80
      targetPort: 80
