# Cache (Redis): guarda por alguns segundos o resultado das consultas agregadas.
# Deployment sem volume de propósito: cache é descartável — se o pod morrer, só começa vazio.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: aps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          # Sem gravar em disco e com teto de memória: ao encher, descarta as chaves menos usadas
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 250m, memory: 128Mi }
          livenessProbe:
            tcpSocket: { port: 6379 }
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: aps
spec:
  selector:
    app: redis
  ports:
    - port: 6379
