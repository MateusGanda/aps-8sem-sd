<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitoramento Ambiental Urbano</title>
<style>
  :root {
    --bg: #f4f6f8; --card: #ffffff; --text: #17202a; --muted: #5f6b7a; --line: #dfe4ea;
    --accent: #0b6e99; --ok: #1e7e45; --warn: #a15c00; --bad: #b3261e; --chip: #eef2f6;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161b; --card: #1b2129; --text: #e6eaef; --muted: #9aa6b4; --line: #2c3540;
      --accent: #5bb8e0; --ok: #62c98a; --warn: #e3a94a; --bad: #f2867f; --chip: #252d37;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", Roboto, sans-serif; }
  header { padding: 20px 16px 8px; max-width: 1280px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 1.4rem; }
  header p { margin: 0; color: var(--muted); }
  main { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); padding: 16px; max-width: 1280px; margin: 0 auto; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 16px; min-width: 0; }
  h2 { margin: 0; font-size: 1.1rem; }
  h3 { margin: 16px 0 6px; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .badge { font-size: .75rem; padding: 2px 8px; border-radius: 999px; background: var(--chip); white-space: nowrap; }
  .badge.ok { color: var(--ok); } .badge.bad { color: var(--bad); } .badge.warn { color: var(--warn); }
  .served { margin: 6px 0 0; font-size: .8rem; color: var(--muted); overflow-wrap: anywhere; }
  code { font: .8rem ui-monospace, Consolas, monospace; }
  .summary { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; }
  .summary b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
  .summary span { color: var(--muted); font-size: .85rem; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .85rem; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  ul { list-style: none; margin: 0; padding: 0; font-size: .85rem; }
  li { padding: 5px 0; border-bottom: 1px solid var(--line); }
  li small { color: var(--muted); display: block; }
  .empty { color: var(--muted); font-size: .85rem; }
  .pods li { display: flex; justify-content: space-between; gap: 8px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--chip); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.critical { color: var(--bad); }
  .result { margin: 8px 0 0; font-size: .8rem; color: var(--muted); min-height: 1.2em; }
</style>
</head>
<body>
<header>
  <h1>Monitoramento Ambiental Urbano</h1>
  <p>Cliente leve: consulta as três APIs pelo gateway e mostra qual pod respondeu. Atualiza a cada 5 s.</p>
</header>
<main id="services"></main>

<script>
// Cada serviço é alcançado pelo MESMO endereço do cliente, só mudando o prefixo (roteamento por caminho no gateway).
const SERVICES = [
  {
    name: "Qualidade do ar", prefix: "/air-quality", api: "/air-quality/api/v1/air-quality",
    readings: { path: "/particulate?limit=5", columns: [["Estação", "stationId"], ["Área", "areaId"], ["PM2.5", "pm25"], ["PM10", "pm10"]] },
    aggregate: {
      label: "Média da área CENTRO (24 h)", path: "/areas/CENTRO/average?hours=24",
      values: r => [["PM2.5", num(r.averagePm25)], ["PM10", num(r.averagePm10)]],
    },
    post: {
      path: "/particulate", hint: "três leituras críticas seguidas geram alerta",
      body: critical => ({
        stationId: "EST-AR-01", sensorId: "EST-AR-01-PM", areaId: "CENTRO",
        pm25: critical ? rand(55, 70) : rand(8, 18), pm10: critical ? rand(90, 120) : rand(20, 35),
      }),
    },
  },
  {
    name: "Alagamento", prefix: "/flooding", api: "/flooding/api/v1/flooding",
    readings: { path: "/water-level?limit=5", columns: [["Ponto", "monitoringPointId"], ["Sensor", "sensorId"], ["Nível (cm)", "waterLevelCm"]] },
    aggregate: {
      label: "Nível atual do ponto PT-01", path: "/monitoring-points/PT-01/latest",
      values: r => [["Nível (cm)", num(r.waterLevel?.waterLevelCm)], ["Chuva (mm)", num(r.rainfall?.rainfallMm)]],
    },
    post: {
      path: "/water-level", hint: "gera alerta quando o nível cruza a cota",
      body: critical => ({ monitoringPointId: "PT-01", sensorId: "PT-01-NIVEL", waterLevelCm: critical ? rand(340, 390) : rand(80, 160) }),
    },
  },
  {
    name: "Inversão térmica", prefix: "/thermal-inversion", api: "/thermal-inversion/api/v1/thermal-inversion",
    readings: { path: "/temperature-profile?limit=5", columns: [["Estação", "stationId"], ["Área", "areaId"], ["Superfície °C", "surfaceTemperatureC"], ["Altitude °C", "upperTemperatureC"]] },
    aggregate: {
      label: "Perfil térmico da área CENTRO (24 h)", path: "/areas/CENTRO/thermal-profile?hours=24",
      values: r => [["Gradiente médio °C", num(r.averageGradientC)], ["Leituras", r.readingsCount ?? "—"], ["Inversão", r.inversionDetected ? "sim" : "não"]],
    },
    post: {
      path: "/temperature-profile", hint: "gera alerta quando a inversão começa",
      body: critical => {
        const surface = rand(16, 22);
        return {
          stationId: "EST-TI-01", areaId: "CENTRO", surfaceSensorId: "EST-TI-01-SUP", upperSensorId: "EST-TI-01-ALT",
          surfaceTemperatureC: surface, upperTemperatureC: round(surface + (critical ? rand(2, 5) : -rand(2, 5))),
        };
      },
    },
  },
];

function rand(min, max) { return round(min + Math.random() * (max - min)); }
function round(value) { return Math.round(value * 10) / 10; }
function num(value) { return value == null ? "—" : round(value); }
function time(iso) { return new Date(iso).toLocaleTimeString("pt-BR"); }

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "class") node.className = value; else if (key === "onclick") node.onclick = value; else node.setAttribute(key, value);
  }
  for (const child of children) node.append(child);
  return node;
}

// Toda chamada passa por aqui: além do corpo, guarda os cabeçalhos que o serviço devolve
// (X-Pod = quem atendeu, X-Versao = versão da imagem, X-Cache = HIT/MISS).
async function call(service, url, options) {
  const response = await fetch(url, { cache: "no-store", ...options });
  const pod = response.headers.get("X-Pod");
  if (pod) {
    service.pods[pod] = (service.pods[pod] ?? 0) + 1;
    service.last = { pod, version: response.headers.get("X-Versao") };
  }
  const text = await response.text();
  let data = text;
  try { data = JSON.parse(text); } catch { /* resposta que não é JSON (health check) */ }
  return { ok: response.ok, status: response.status, cache: response.headers.get("X-Cache"), data };
}

function render(service) {
  const ui = {
    status: el("span", { class: "badge" }, "…"),
    served: el("p", { class: "served" }),
    cache: el("span", { class: "badge" }, "cache: —"),
    summary: el("div", { class: "summary" }),
    readings: el("div", { class: "scroll" }),
    alerts: el("ul"),
    pods: el("ul", { class: "pods" }),
    result: el("p", { class: "result" }),
  };
  const send = critical => async () => {
    const body = service.post.body(critical);
    try {
      const response = await call(service, service.api + service.post.path, {
        method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
      });
      ui.result.textContent = response.ok
        ? `Leitura ${response.data.id} gravada por ${service.last?.pod ?? "?"}.`
        : `Falhou: HTTP ${response.status}.`;
    } catch { ui.result.textContent = "Falhou: gateway inacessível."; }
    refresh(service);
  };
  service.ui = ui;
  return el("section", {},
    el("div", { class: "top" }, el("h2", {}, service.name), ui.status),
    ui.served,
    el("h3", {}, service.aggregate.label), el("div", { class: "summary" }, ui.summary, ui.cache),
    el("h3", {}, "Últimas leituras"), ui.readings,
    el("h3", {}, "Últimos alertas"), ui.alerts,
    el("h3", {}, "Pods que atenderam esta página"), ui.pods,
    el("div", { class: "actions" },
      el("button", { onclick: send(false) }, "Enviar leitura normal"),
      el("button", { class: "critical", title: service.post.hint, onclick: send(true) }, "Enviar leitura crítica")),
    ui.result);
}

async function refresh(service) {
  const ui = service.ui;
  try {
    const [ready, aggregate, readings, alerts] = await Promise.all([
      call(service, service.prefix + "/health/ready"),
      call(service, service.api + service.aggregate.path),
      call(service, service.api + service.readings.path),
      call(service, service.api + "/alerts?limit=5"),
    ]);

    ui.status.textContent = ready.ok ? "pronto" : `indisponível (${ready.status})`;
    ui.status.className = "badge " + (ready.ok ? "ok" : "bad");
    ui.served.replaceChildren("Última resposta de ", el("code", {}, service.last?.pod ?? "?"), ` · versão ${service.last?.version ?? "?"}`);

    ui.cache.textContent = "cache: " + (aggregate.cache ?? "—");
    ui.cache.className = "badge " + (aggregate.cache === "HIT" ? "ok" : aggregate.cache === "BYPASS" ? "warn" : "");
    ui.summary.replaceChildren(...(aggregate.ok
      ? service.aggregate.values(aggregate.data).flatMap(([label, value]) => [el("span", {}, label), el("b", {}, String(value))])
      : [el("span", {}, "sem leituras ainda")]));

    const columns = service.readings.columns;
    const rows = readings.ok ? readings.data : [];
    ui.readings.replaceChildren(rows.length === 0 ? el("p", { class: "empty" }, "Nenhuma leitura.") : el("table", {},
      el("tr", {}, ...columns.map(([label]) => el("th", {}, label)), el("th", {}, "Hora")),
      ...rows.map(row => el("tr", {}, ...columns.map(([, field]) => el("td", {}, String(row[field]))), el("td", {}, time(row.timestamp))))));

    const alertRows = alerts.ok ? alerts.data : [];
    ui.alerts.replaceChildren(...(alertRows.length === 0 ? [el("li", { class: "empty" }, "Nenhum alerta.")]
      : alertRows.map(alert => el("li", {}, alert.message, el("small", {}, `${time(alert.timestamp)} · valor ${num(alert.value)} · limite ${num(alert.threshold)}`)))));
  } catch {
    ui.status.textContent = "gateway inacessível";
    ui.status.className = "badge bad";
  }
  ui.pods.replaceChildren(...Object.entries(service.pods).sort().map(([pod, count]) =>
    el("li", {}, el("code", {}, pod), el("span", {}, `${count} respostas`))));
}

const container = document.getElementById("services");
for (const service of SERVICES) {
  service.pods = {};
  container.append(render(service));
  refresh(service);
  setInterval(() => refresh(service), 5000);
}
</script>
</body>
</html>
