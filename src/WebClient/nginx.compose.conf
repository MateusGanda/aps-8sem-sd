# Configuração usada no Docker Compose (montada por cima da padrão).
# Sem Ingress, o próprio nginx faz o papel de gateway: encaminha cada prefixo para a API correspondente.
# O prefixo segue inteiro; a API o remove com PATH_BASE.
server {
    listen 80;
    root /usr/share/nginx/html;

    add_header X-Pod $hostname always;
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri /index.html;
    }

    location /air-quality/       { proxy_pass http://air-quality-api:8080; }
    location /flooding/          { proxy_pass http://flooding-api:8080; }
    location /thermal-inversion/ { proxy_pass http://thermal-inversion-api:8080; }
}
