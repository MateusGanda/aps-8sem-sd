# Configuração usada no Kubernetes: o nginx só entrega a página.
# Quem roteia /air-quality, /flooding e /thermal-inversion para as APIs é o Ingress.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Mesmo cabeçalho das APIs: mostra qual pod do cliente atendeu
    add_header X-Pod $hostname always;
    # Sem cache no navegador: uma versão nova da página aparece no próximo F5
    add_header Cache-Control "no-store" always;

    location / {
        try_files $uri $uri/ =404;      # caminho desconhecido é 404, não a página
    }
}
